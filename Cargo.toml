[workspace]

[package]
name = "files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
viewkit = { git = "https://github.com/mochiOS/viewkit", package = "viewkit" }

[target.'cfg(target_os = "mochios")'.dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }

[[bin]]
name = "files"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
