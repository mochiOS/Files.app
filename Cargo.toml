[workspace]

[package]
name = "files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }
appcore = { package = "mochios-appcore", git = "https://github.com/mochiOS/devkit" }
mochios-workspace-protocol = { git = "https://github.com/mochiOS/syscalls" }
viewkit = { git = "https://github.com/mochiOS/viewkit", rev = "768d9f903f9ae4bb7b6c861cd2d1cd3e8fbc4d95" }

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["std"] }

[[bin]]
name = "files"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
